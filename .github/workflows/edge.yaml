name: Edge build

# Unstable builds: rebuild whenever the packaging on main changes, and once a
# day to pick up new upstream releases. Published to the edge channel.
on:
  push:
    branches: [main]
    paths:
      - 'snap/**'
      - '.github/workflows/edge.yaml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-edge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      # Gate publishing on the snap actually running. "strict" commands must
      # exit 0; "nocrash" commands may exit non-zero (e.g. the lemonade picker
      # with no lemonade-server in CI) but must not hang, be missing (126/127)
      # or die from a signal (>128, e.g. 139 = segfault). The .daemon apps are
      # not exercised: they start real servers even when passed --help.
      - name: Smoke test
        run: |
          sudo snap install --dangerous --classic "${{ steps.build.outputs.snap }}"
          snap wait system seed.loaded
          fail=0
          check() {
            mode=$1; shift
            echo "::group::$*"
            rc=0
            timeout -k 5 120 "$@" </dev/null >"$RUNNER_TEMP/smoke.out" 2>&1 || rc=$?
            head -40 "$RUNNER_TEMP/smoke.out"
            echo "::endgroup::"
            if [ "$mode" = strict ] && [ "$rc" -ne 0 ]; then
              echo "::error::'$*' exited $rc"; fail=1
            elif [ "$rc" -eq 124 ] || [ "$rc" -ge 126 ]; then
              echo "::error::'$*' hung or crashed (exit $rc)"; fail=1
            fi
          }
          check strict openclaw --version
          check strict openclaw --help
          check strict openclaw.lemonade --help
          exit $fail

      - name: Publish to edge
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
